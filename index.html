<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RPG_LLM — Virtual Tabletop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="vtt-layout">
    <!-- Turn Bar / Header -->
    <header id="turn-bar">
      <div class="turn-bar-content">
        <span id="turn-round" class="turn-round">Rodada 1</span>
        <span class="turn-separator">·</span>
        <span id="turn-active" class="turn-active">Aguardando início...</span>
        <span class="turn-separator">·</span>
        <span id="turn-llm-badge" class="turn-llm-badge">Prompt B · gemini-3.8-flash</span>
      </div>
      <div class="turn-bar-actions">
        <button id="btn-settings" class="btn-settings" title="Configurações do Mestre LLM (API, Modelo, Prompt)">⚙ Configurações</button>
        <button id="btn-toggle-gm" class="btn-toggle-gm" title="Alternar Painel do Mestre (Atalho: `)">Mestre GM (Dev)</button>
      </div>
    </header>

    <!-- Canvas Board Area -->
    <main id="board-wrap">
      <canvas id="board" width="768" height="768"></canvas>
      <div id="hotseat-banner" class="hotseat-banner" aria-live="polite"></div>
    </main>

    <!-- Side Panel: Chat / Narrative & Activity Log -->
    <section id="side">
      <div id="chat-panel" class="side-panel-section chat-section"></div>

      <div id="activity-log" class="side-panel-section log-section">
        <div class="panel-header">
          <div class="panel-title-group">
            <button id="btn-log-toggle" class="btn-log-toggle" title="Recolher Registro de Atividades" aria-label="Recolher Registro de Atividades">▼</button>
            <h3>Registro de Atividades</h3>
          </div>
          <div class="log-actions">
            <button id="btn-log-copy" class="btn-sm" title="Copiar log">Copiar</button>
            <button id="btn-log-clear" class="btn-sm" title="Limpar log">Limpar</button>
          </div>
        </div>
        <ul class="log-list"></ul>
      </div>
    </section>

    <!-- HUD Footer -->
    <footer id="hud"></footer>

    <!-- GM Drawer (Collapsible) -->
    <aside id="gm-drawer" class="gm-drawer-collapsed">
      <!-- Human GM Mode injected here -->
    </aside>
  </div>

  <!-- Game Over Modal (Task 3.9) -->
  <dialog id="overlay-gameover" class="gameover-modal">
    <div class="gameover-box">
      <div id="gameover-icon" class="gameover-icon">🏆</div>
      <h2 id="gameover-title" class="gameover-title">Vitória!</h2>
      <p id="gameover-desc" class="gameover-desc">Todos os inimigos foram derrotados e a masmorra foi conquistada com honra.</p>
      <button id="btn-new-game" class="btn-new-game">Novo Jogo</button>
    </div>
  </dialog>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
