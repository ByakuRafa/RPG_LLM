<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPG_LLM — Virtual Tabletop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="vtt-layout">
    <!-- Turn Bar / Header -->
    <header id="turn-bar">
      <div class="turn-bar-content">
        <span id="turn-round" class="turn-round">Rodada 1</span>
        <span class="turn-separator">·</span>
        <span id="turn-active" class="turn-active">Aguardando início...</span>
      </div>
      <div class="turn-bar-actions">
        <button id="btn-toggle-gm" class="btn-toggle-gm" title="Alternar Painel do Mestre (Atalho: `)">Mestre GM (Dev)</button>
      </div>
    </header>

    <!-- Canvas Board Area -->
    <main id="board-wrap">
      <canvas id="board" width="768" height="768"></canvas>
    </main>

    <!-- Side Panel: Chat / Narrative & Activity Log -->
    <section id="side">
      <div id="chat-panel" class="side-panel-section">
        <div class="panel-header">
          <h3>Narrativa & Chat</h3>
        </div>
        <div class="panel-content placeholder-text">
          Aguardando comandos da party...
        </div>
      </div>

      <div id="activity-log" class="side-panel-section">
        <div class="panel-header">
          <h3>Registro de Atividades</h3>
          <div class="log-actions">
            <button id="btn-log-copy" class="btn-sm" title="Copiar log">Copiar</button>
            <button id="btn-log-clear" class="btn-sm" title="Limpar log">Limpar</button>
          </div>
        </div>
        <ul class="log-list"></ul>
      </div>
    </section>

    <!-- HUD Footer -->
    <footer id="hud">
      <div class="hud-placeholder">
        HUD Heróis · Painel de Status e Recursos
      </div>
    </footer>

    <!-- GM Drawer (Collapsible) -->
    <aside id="gm-drawer" class="gm-drawer-collapsed">
      <!-- Human GM Mode injected here -->
    </aside>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
